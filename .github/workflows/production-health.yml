name: production-health-check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 20
      - name: Check production health endpoint
        run: |
          set -euo pipefail
          response="$(curl -fsS https://agent-portability-check.vercel.app/api/health)"
          echo "$response"
          echo "$response" | grep -q '"telemetryConfigured":true'
          echo "$response" | grep -q '"hostConfigured":true'
